[project]
name = "reap-energy-agents-api"
version = "0.1.0"
description = "Energy maintenance agent: diagnoses machines from power telemetry and buys repair parts with Reap Agentic Payments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic[email]>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
